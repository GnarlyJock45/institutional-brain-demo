<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Institutional Brain — Interactive Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: { 500: '#14B8A6', 600: '#0D9488', 300: '#99E6E0', 50: '#ECFDF8' },
        ink:   { 900: '#0F172A', 700: '#334155', 500: '#64748B', 400: '#94A3B8', 200: '#E2E8F0', 100: '#EEF2F6', 50: '#F7F9FA' },
      },
      fontFamily: {
        sans: ['Inter', 'system-ui', 'sans-serif'],
        mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
      },
      boxShadow: {
        card:  '0 1px 2px rgba(15,23,42,.04), 0 1px 1px rgba(15,23,42,.03)',
        lift:  '0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.04)',
        panel: '0 12px 32px rgba(15,23,42,.10), 0 4px 8px rgba(15,23,42,.05)',
      },
    },
  },
};
</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html, body { height: 100%; background: #F7F9FA; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #0F172A; -webkit-font-smoothing: antialiased; }
  [x-cloak] { display: none !important; }

  /* Graph canvas */
  #graph-svg { width: 100%; height: 100%; display: block; cursor: grab; }
  #graph-svg:active { cursor: grabbing; }
  .node-circle { cursor: pointer; transition: r 150ms ease-out, stroke-width 150ms ease-out, filter 150ms ease-out; }
  .node-label  { pointer-events: none; font-size: 11px; font-weight: 600; fill: #fff; text-anchor: middle; dominant-baseline: central; user-select: none; }
  .edge        { fill: none; transition: stroke-opacity 180ms ease-out, stroke-width 180ms ease-out; }
  .cluster-label-bg { fill: #fff; stroke: #E2E8F0; stroke-width: 1; pointer-events: none; }
  .cluster-label {
    pointer-events: none; user-select: none;
    font-size: 10.5px; font-weight: 600; fill: #334155;
    letter-spacing: 0.01em;
  }

  /* Tooltip */
  .gtooltip {
    position: absolute; pointer-events: none; z-index: 40;
    background: rgba(15,23,42,.95); color: #fff; padding: 6px 10px;
    border-radius: 8px; font-size: 12px; line-height: 1.3;
    box-shadow: 0 8px 24px rgba(15,23,42,.20);
    opacity: 0; transform: translate(-50%, -120%) scale(.96);
    transition: opacity 120ms ease-out, transform 120ms ease-out;
    white-space: nowrap;
  }
  .gtooltip.show { opacity: 1; transform: translate(-50%, -130%) scale(1); }
  .gtooltip .imp { color: #99E6E0; font-weight: 500; margin-left: 6px; }

  /* Cross-fade between views */
  .view-fade-enter { animation: viewIn 200ms ease-out both; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

  /* Detail panel slide-in */
  .slide-in-right { animation: slideR 250ms cubic-bezier(.2,.7,.2,1) both; }
  @keyframes slideR { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Modal */
  .modal-back { animation: fadeIn 180ms ease-out both; backdrop-filter: blur(8px); }
  .modal-card { animation: modalIn 220ms cubic-bezier(.2,.7,.2,1) both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }

  /* Card subtle hover lift */
  .mb-card { transition: transform 150ms ease-out, box-shadow 150ms ease-out, border-color 150ms ease-out; }
  .mb-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(15,23,42,.07); }

  /* Brief teal pulse for nav-into-bank highlight */
  @keyframes pulseTeal {
    0%   { box-shadow: 0 0 0 0 rgba(20,184,166,.55); border-color: #14B8A6; }
    100% { box-shadow: 0 0 0 14px rgba(20,184,166,0); border-color: #E2E8F0; }
  }
  .pulse-teal { animation: pulseTeal 700ms ease-out 0s 2; border-color: #14B8A6 !important; }

  /* Chat bubbles */
  .bubble-user      { background: #14B8A6; color: #fff; }
  .bubble-assistant { background: #fff; color: #0F172A; border: 1px solid #E2E8F0; }
  .chat-stream-cursor::after {
    content: '▍'; color: #14B8A6; margin-left: 1px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Citation popover */
  .cite-pop {
    animation: popIn 180ms ease-out both;
    transform-origin: top left;
  }
  @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

  /* Sector switch overlay */
  .sector-overlay {
    position: absolute; inset: 0; z-index: 60;
    background: rgba(247,249,250,.86); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    color: #334155; font-weight: 500; font-size: 13px;
    transition: opacity 200ms ease-out;
  }
  .sector-dimmed { transition: opacity 200ms ease-out, filter 200ms ease-out; }

  /* Filter card translate animation (Memory Bank) */
  .grid-card-enter { animation: cardIn 200ms ease-out both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Suggestion chip pulse */
  @keyframes chipPulse {
    0%   { box-shadow: 0 0 0 0 rgba(20,184,166,.4); }
    100% { box-shadow: 0 0 0 10px rgba(20,184,166,0); }
  }
  .chip-pulse { animation: chipPulse 600ms ease-out; }

  /* Scrollbar */
  .scroll-pretty::-webkit-scrollbar { width: 10px; height: 10px; }
  .scroll-pretty::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 8px; }
  .scroll-pretty::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

  /* Sidebar item hover */
  .nav-item:hover { background: #EEF2F6; }
  .nav-item.active { background: #ECFDF8; }
  .nav-item.active::before {
    content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px;
    background: #14B8A6; border-radius: 0 2px 2px 0;
  }
</style>
</head>

<body x-data="ibApp()" x-init="init()" x-cloak class="h-full overflow-hidden">

  <!-- =================== TOP BAR =================== -->
  <header class="h-16 border-b border-ink-200 bg-white flex items-center justify-between px-5 relative z-30">
    <!-- Brand + counter -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-brand-500 inline-block"></span>
        <span class="font-semibold text-[15px] tracking-tight text-ink-900">Institutional Brain</span>
      </div>
      <div class="hidden sm:block text-ink-500 text-xs ml-1 font-mono" x-text="contextLine"></div>
    </div>

    <!-- Sector switcher + about -->
    <div class="flex items-center gap-4">
      <div class="hidden md:flex items-center gap-1 p-1 rounded-full border border-ink-200 bg-ink-50"
           :title="'Same architecture, different domain. Click to swap the underlying dataset.'">
        <button @click="switchSector('healthcare')"
                :class="sector==='healthcare' ? 'bg-brand-500 text-white shadow-sm' : 'text-ink-700 hover:text-ink-900'"
                class="text-[12px] font-medium px-3 py-1 rounded-full transition-colors">
          Healthcare
        </button>
        <button @click="switchSector('logistics')"
                :class="sector==='logistics' ? 'bg-brand-500 text-white shadow-sm' : 'text-ink-700 hover:text-ink-900'"
                class="text-[12px] font-medium px-3 py-1 rounded-full transition-colors">
          Logistics
        </button>
      </div>
      <button @click="aboutOpen=true" class="text-ink-500 hover:text-ink-900 p-2 rounded-md hover:bg-ink-50" title="About this demo">
        <i data-lucide="info" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- =================== MAIN SHELL =================== -->
  <div class="flex" style="height: calc(100% - 4rem);">

    <!-- =================== SIDEBAR =================== -->
    <aside class="w-60 shrink-0 border-r border-ink-200 bg-white flex flex-col overflow-y-auto scroll-pretty">
      <nav class="px-3 pt-4 pb-2">
        <template x-for="item in navItems" :key="item.id">
          <button @click="switchView(item.id)"
                  :class="view===item.id ? 'active text-ink-900' : 'text-ink-700'"
                  class="nav-item w-full relative flex items-center gap-3 px-3 py-2 rounded-md text-[13px] font-medium mb-1">
            <i :data-lucide="item.icon" class="w-4 h-4"></i>
            <span x-text="item.label"></span>
          </button>
        </template>
      </nav>

      <div class="px-5 mt-2 mb-2 text-[11px] uppercase tracking-wider text-ink-400 font-semibold">Categories</div>
      <div class="px-3 pb-5 space-y-0.5">
        <button @click="selectedCategory=null"
                :class="selectedCategory===null ? 'bg-ink-100' : 'hover:bg-ink-50'"
                class="w-full flex items-center justify-between px-3 py-1.5 rounded-md text-[12.5px] text-ink-700">
          <span class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-ink-400"></span>
            All
          </span>
          <span class="text-ink-400 tabular-nums" x-text="data.nodes.length"></span>
        </button>
        <template x-for="cat in data.categories" :key="cat.id">
          <button @click="selectedCategory = (selectedCategory===cat.id ? null : cat.id)"
                  :class="selectedCategory===cat.id ? 'bg-ink-100' : 'hover:bg-ink-50'"
                  class="w-full flex items-center justify-between px-3 py-1.5 rounded-md text-[12.5px] text-ink-700">
            <span class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full" :style="`background:${cat.color}`"></span>
              <span x-text="cat.name"></span>
            </span>
            <span class="text-ink-400 tabular-nums" x-text="cat.count"></span>
          </button>
        </template>
      </div>

      <div class="mt-auto px-5 py-3 border-t border-ink-200 text-[11px] text-ink-400">
        Static demo · v1.0
      </div>
    </aside>

    <!-- =================== MAIN CANVAS =================== -->
    <main class="flex-1 relative overflow-hidden" :class="sectorSwitching ? 'sector-dimmed' : ''"
          :style="sectorSwitching ? 'opacity:.2; filter:blur(1px);' : ''">

      <!-- ============ VIEW: GRAPH ============ -->
      <section x-show="view==='graph'" x-transition.opacity.duration.200ms class="absolute inset-0">
        <!-- Search field (centered top) -->
        <div class="absolute top-4 left-1/2 -translate-x-1/2 z-20">
          <div class="relative">
            <i data-lucide="search" class="w-4 h-4 text-ink-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input x-model="searchQuery" type="text" placeholder="Search memories…"
                   class="w-[280px] pl-9 pr-3 py-2 text-[13px] bg-white border border-ink-200 rounded-full shadow-card focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/15">
          </div>
        </div>

        <!-- Floating stats card -->
        <div class="absolute top-4 right-4 z-20 bg-white/80 backdrop-blur-md border border-ink-200 rounded-xl px-4 py-2.5 shadow-card">
          <div class="text-[11px] uppercase tracking-wider text-ink-400 font-semibold mb-1">Memory Layer</div>
          <div class="text-[12.5px] text-ink-700 font-medium font-mono tabular-nums">
            <span x-text="data.meta.nodeCount"></span> nodes ·
            <span x-text="data.meta.connectionCount"></span> connections ·
            <span x-text="data.categories.length"></span> categories ·
            <span x-text="data.meta.avgImportance + '%'"></span> avg
          </div>
        </div>

        <!-- The graph canvas -->
        <div class="absolute inset-0" @click.self="clearSelection()">
          <svg id="graph-svg" @click.self="clearSelection()"></svg>
          <div id="graph-tooltip" class="gtooltip"></div>
        </div>

        <!-- Node detail panel -->
        <template x-if="selectedNode">
          <div class="slide-in-right absolute top-0 right-0 h-full w-[360px] bg-white border-l border-ink-200 shadow-panel z-30 flex flex-col">
            <div class="flex items-start justify-between px-5 pt-5 pb-3 border-b border-ink-100">
              <div>
                <div class="text-[10px] uppercase tracking-wider font-semibold mb-1 inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full border"
                     :style="`color:${catColor(selectedNode.category)}; border-color:${catColor(selectedNode.category)}55; background:${catColor(selectedNode.category)}11`">
                  <span class="w-1.5 h-1.5 rounded-full" :style="`background:${catColor(selectedNode.category)}`"></span>
                  <span x-text="catName(selectedNode.category)"></span>
                </div>
                <h3 class="text-[15px] font-semibold text-ink-900 leading-snug" x-text="selectedNode.name"></h3>
              </div>
              <button @click="clearSelection()" class="text-ink-400 hover:text-ink-700 p-1 rounded-md">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="px-5 py-4 flex-1 overflow-y-auto scroll-pretty space-y-4">
              <div>
                <div class="flex items-center justify-between text-[11px] text-ink-500 mb-1.5">
                  <span class="uppercase tracking-wider font-semibold">Importance</span>
                  <span class="font-mono tabular-nums text-ink-700" x-text="selectedNode.importance + '/100'"></span>
                </div>
                <div class="h-1.5 bg-ink-100 rounded-full overflow-hidden">
                  <div class="h-full bg-brand-500" :style="`width:${selectedNode.importance}%`"></div>
                </div>
              </div>

              <p class="text-[13.5px] text-ink-700 leading-relaxed" x-text="selectedNode.description"></p>

              <div class="grid grid-cols-2 gap-3 text-[12px]">
                <div class="bg-ink-50 rounded-lg px-3 py-2">
                  <div class="text-ink-400 uppercase tracking-wider text-[10px] font-semibold mb-0.5">Times Accessed</div>
                  <div class="text-ink-900 font-mono tabular-nums font-semibold" x-text="selectedNode.timesAccessed"></div>
                </div>
                <div class="bg-ink-50 rounded-lg px-3 py-2">
                  <div class="text-ink-400 uppercase tracking-wider text-[10px] font-semibold mb-0.5">Last Activity</div>
                  <div class="text-ink-900 font-mono tabular-nums font-semibold" x-text="selectedNode.ageStr"></div>
                </div>
              </div>

              <div>
                <div class="text-[11px] uppercase tracking-wider font-semibold text-ink-500 mb-2">Linked to</div>
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="nb in neighbors(selectedNode.id)" :key="nb.id">
                    <button @click="selectNode(nb.id)"
                            class="text-[12px] px-2.5 py-1 rounded-full border border-ink-200 hover:border-brand-500 hover:bg-brand-50 text-ink-700 transition-colors">
                      <span class="w-1.5 h-1.5 rounded-full inline-block mr-1.5 align-middle" :style="`background:${catColor(nb.category)}`"></span>
                      <span x-text="nb.name"></span>
                    </button>
                  </template>
                  <span x-show="neighbors(selectedNode.id).length===0" class="text-[12px] text-ink-400 italic">No connections</span>
                </div>
              </div>

              <div x-show="selectedNode.tags && selectedNode.tags.length">
                <div class="text-[11px] uppercase tracking-wider font-semibold text-ink-500 mb-2">Tags</div>
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="t in selectedNode.tags" :key="t">
                    <span class="text-[11px] bg-ink-100 text-ink-700 px-2 py-0.5 rounded-md font-mono" x-text="t"></span>
                  </template>
                </div>
              </div>
            </div>

            <div class="px-5 py-3 border-t border-ink-100">
              <button @click="openInBank(selectedNode.id)"
                      class="w-full text-[12.5px] text-brand-600 hover:text-brand-500 font-medium flex items-center justify-center gap-1.5 py-1">
                View in Memory Bank
                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        </template>
      </section>

      <!-- ============ VIEW: BANK ============ -->
      <section x-show="view==='bank'" x-transition.opacity.duration.200ms class="absolute inset-0 overflow-y-auto scroll-pretty">
        <div class="max-w-[1280px] mx-auto px-6 py-6">

          <!-- Stats row -->
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-5">
            <template x-for="s in bankStats" :key="s.label">
              <div class="bg-white border border-ink-200 rounded-xl px-4 py-3 shadow-card relative overflow-hidden">
                <div class="absolute bottom-0 left-0 right-0 h-[2px] bg-brand-500/70"></div>
                <div class="flex items-center justify-between mb-1.5 text-ink-400">
                  <span class="text-[10.5px] uppercase tracking-wider font-semibold" x-text="s.label"></span>
                  <i :data-lucide="s.icon" class="w-3.5 h-3.5"></i>
                </div>
                <div class="text-[22px] font-semibold text-ink-900 tabular-nums" x-text="s.value"></div>
              </div>
            </template>
          </div>

          <!-- Filters row -->
          <div class="bg-white border border-ink-200 rounded-xl px-4 py-3 mb-5 flex flex-wrap items-center gap-3 shadow-card">
            <div class="flex flex-wrap gap-1.5 flex-1 min-w-[260px]">
              <button @click="bankFilterCats = []"
                      :class="bankFilterCats.length===0 ? 'bg-ink-900 text-white border-ink-900' : 'bg-white text-ink-700 border-ink-200 hover:border-ink-400'"
                      class="text-[11.5px] px-2.5 py-1 rounded-full border transition-colors">
                All
              </button>
              <template x-for="cat in data.categories" :key="cat.id">
                <button @click="toggleBankCat(cat.id)"
                        :class="bankFilterCats.includes(cat.id) ? 'text-white border-transparent' : 'bg-white text-ink-700 border-ink-200 hover:border-ink-400'"
                        :style="bankFilterCats.includes(cat.id) ? `background:${cat.color}` : ''"
                        class="text-[11.5px] px-2.5 py-1 rounded-full border transition-colors flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full" :style="`background:${cat.color}`" x-show="!bankFilterCats.includes(cat.id)"></span>
                  <span x-text="cat.name"></span>
                </button>
              </template>
            </div>
            <div class="flex items-center gap-2">
              <div class="relative">
                <i data-lucide="search" class="w-3.5 h-3.5 text-ink-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
                <input x-model="bankQuery" type="text" placeholder="Search…"
                       class="pl-8 pr-2.5 py-1.5 text-[12.5px] bg-ink-50 border border-ink-200 rounded-md w-[160px] focus:outline-none focus:border-brand-500 focus:bg-white">
              </div>
              <select x-model="bankSort" class="text-[12.5px] bg-ink-50 border border-ink-200 rounded-md px-2 py-1.5 focus:outline-none focus:border-brand-500 focus:bg-white">
                <option value="recent">Most Recent</option>
                <option value="accessed">Most Accessed</option>
                <option value="importance">Highest Confidence</option>
              </select>
            </div>
          </div>

          <!-- Card grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <template x-for="n in bankCards" :key="n.id">
              <div :id="'bank-card-'+n.id"
                   class="mb-card grid-card-enter bg-white border border-ink-200 rounded-xl p-4 shadow-card cursor-pointer flex flex-col"
                   @click="openModal(n.id)">
                <!-- Header row -->
                <div class="flex items-start justify-between gap-2 mb-3">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="bg-brand-500 text-white text-[11px] font-semibold px-2 py-0.5 rounded-full" x-text="n.importance + '%'"></span>
                    <span class="text-[11px] px-2 py-0.5 rounded-full border flex items-center gap-1.5"
                          :style="`color:${catColor(n.category)}; border-color:${catColor(n.category)}66; background:${catColor(n.category)}10`">
                      <span class="w-1.5 h-1.5 rounded-full" :style="`background:${catColor(n.category)}`"></span>
                      <span x-text="catName(n.category)"></span>
                    </span>
                  </div>
                  <button @click.stop="toggleStar(n.id)" class="text-ink-400 hover:text-amber-500 transition-colors">
                    <i :data-lucide="starred[n.id] ? 'star' : 'star'" class="w-4 h-4" :class="starred[n.id] ? 'fill-amber-400 text-amber-400 scale-110' : ''" style="transition: transform 150ms"></i>
                  </button>
                </div>

                <!-- Title -->
                <h3 class="text-[14px] font-semibold text-ink-900 leading-snug mb-1.5" x-text="n.name"></h3>
                <!-- Description -->
                <p class="text-[12.5px] text-ink-700 leading-relaxed mb-3 line-clamp-3" x-text="n.description"></p>

                <!-- Metadata row -->
                <div class="flex items-center gap-4 text-[11.5px] text-ink-500 mb-3">
                  <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i><span x-text="n.ageStr"></span></span>
                  <span class="flex items-center gap-1"><i data-lucide="eye" class="w-3 h-3"></i><span x-text="n.timesAccessed"></span></span>
                  <span class="flex items-center gap-1"><i data-lucide="git-branch" class="w-3 h-3"></i><span x-text="degree(n.id)"></span></span>
                </div>

                <!-- Context (expandable) -->
                <button @click.stop="toggleContext(n.id)"
                        class="flex items-center justify-between w-full text-[11.5px] font-medium text-ink-500 hover:text-ink-900 py-1.5 border-t border-ink-100">
                  <span>Context & sources</span>
                  <i data-lucide="chevron-down" class="w-3.5 h-3.5 transition-transform" :class="ctxOpen[n.id] ? 'rotate-180' : ''"></i>
                </button>
                <div x-show="ctxOpen[n.id]"
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="opacity-0 -translate-y-1"
                     x-transition:enter-end="opacity-100 translate-y-0"
                     class="text-[12px] text-ink-700 space-y-2 pt-1 pb-2" @click.stop>
                  <div>
                    <div class="text-[10.5px] uppercase tracking-wider text-ink-400 font-semibold mb-0.5">Decision context</div>
                    <p x-text="n.context.summary" class="leading-relaxed"></p>
                  </div>
                  <div>
                    <div class="text-[10.5px] uppercase tracking-wider text-ink-400 font-semibold mb-0.5">Sources</div>
                    <div class="font-mono text-[11.5px] text-ink-500" x-text="n.context.sources.join(' · ')"></div>

  function ibApp() {
    return {
      // ---------- state ----------
      sector: 'healthcare',
      view: 'graph',
      selectedCategory: null,
      selectedNode: null,
      searchQuery: '',
      bankFilterCats: [],
      bankSort: 'recent',
      bankQuery: '',
      modalNode: null,
      conversation: [],
      sectorSwitching: false,
      starred: {},
      ctxOpen: {},
      aboutOpen: false,
      _nextMsgId: 1,
      navItems: [
        { id:'graph', label:'Memory Graph', icon:'network' },
        { id:'bank',  label:'Memory Bank',  icon:'database' },
        { id:'chat',  label:'Chat',         icon:'message-square' },
      ],
      bankStats: [],

      // ---------- derived ----------
      get data() { return this.sector === 'healthcare' ? HEALTHCARE_DATA : LOGISTICS_DATA; },
      get contextLine() {
        return `${this.data.meta.name} · ${this.data.meta.nodeCount} nodes · ${this.data.meta.connectionCount} connections`;
      },
      get bankCards() {
        let nodes = [...this.data.nodes];
        if (this.bankFilterCats.length)
          nodes = nodes.filter(n => this.bankFilterCats.includes(n.category));
        if (this.selectedCategory)
          nodes = nodes.filter(n => n.category === this.selectedCategory);
        if (this.bankQuery.trim()) {
          const q = this.bankQuery.toLowerCase();
          nodes = nodes.filter(n =>
            n.name.toLowerCase().includes(q) ||
            n.description.toLowerCase().includes(q) ||
            (n.tags||[]).some(t => t.toLowerCase().includes(q))
          );
        }
        if (this.bankSort === 'accessed')   nodes.sort((a,b) => b.timesAccessed - a.timesAccessed);
        else if (this.bankSort === 'importance') nodes.sort((a,b) => b.importance - a.importance);
        else nodes.sort((a,b) => ageRank(a.ageStr) - ageRank(b.ageStr));
        return nodes;
      },

      // ---------- helpers ----------
      nodeById(id) { return this.data.nodes.find(n => n.id === id); },
      catColor(id) { const c = this.data.categories.find(c => c.id === id); return c ? c.color : '#94A3B8'; },
      catName(id)  { const c = this.data.categories.find(c => c.id === id); return c ? c.name : ''; },
      neighbors(id) {
        const ids = new Set();
        this.data.edges.forEach(([a,b]) => { if (a===id) ids.add(b); else if (b===id) ids.add(a); });
        return [...ids].map(i => this.nodeById(i)).filter(Boolean);
      },
      degree(id) { return this.data.edges.filter(([a,b]) => a===id || b===id).length; },
      computeBankStats() {
        const ns = this.data.nodes;
        const avg = Math.round(ns.reduce((s,n) => s + n.importance, 0) / ns.length);
        const facts = ns.reduce((s,n) => s + (n.context.sources?.length || 0), 0);
        const ents = new Set(ns.flatMap(n => n.tags||[])).size;
        this.bankStats = [
          { label:'Memories',      value: ns.length,                  icon:'database' },
          { label:'Connections',   value: this.data.edges.length,     icon:'git-branch' },
          { label:'Facts',         value: facts,                      icon:'file-text' },
          { label:'Avg Importance',value: avg + '%',                  icon:'gauge' },
          { label:'Entities',      value: ents,                       icon:'tags' },
        ];
      },
      toggleStar(id)    { this.starred[id] = !this.starred[id]; },
      toggleContext(id) { this.ctxOpen[id] = !this.ctxOpen[id]; queueIcons(); },
      toggleBankCat(id) {
        const i = this.bankFilterCats.indexOf(id);
        if (i >= 0) this.bankFilterCats.splice(i,1);
        else        this.bankFilterCats.push(id);
      },

      // ---------- navigation between views ----------
      switchView(v) {
        this.view = v;
        this.$nextTick(() => { queueIcons(); if (v === 'chat') this.scrollChatToBottom(); });
      },
      selectNode(id) {
        this.selectedNode = this.nodeById(id);
        focusGraphNode(id);
        this.$nextTick(queueIcons);
      },
      clearSelection() {
        this.selectedNode = null;
        clearGraphFocus();
      },
      openInBank(id) {
        this.modalNode = null;
        this.switchView('bank');
        this.bankFilterCats = [];
        this.bankQuery = '';
        this.selectedCategory = null;
        this.ctxOpen[id] = true;
        this.$nextTick(() => {
          const el = document.getElementById('bank-card-' + id);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('pulse-teal');
            setTimeout(() => el.classList.remove('pulse-teal'), 1600);
          }
          queueIcons();
        });
      },
      openInGraph(id) {
        this.modalNode = null;
        this.switchView('graph');
        this.$nextTick(() => { this.selectNode(id); centerGraphOnNode(id); });
      },
      openModal(id) {
        this.modalNode = this.nodeById(id);
        this.$nextTick(queueIcons);
      },

      // ---------- sector switch ----------
      switchSector(s) {
        if (s === this.sector) return;
        // Close any panel/modal immediately so we don't try to render details
        // for a node from the outgoing dataset while the fade is in progress.
        this.selectedNode = null;
        this.modalNode = null;
        this.sectorSwitching = true;
        setTimeout(() => {
          this.sector = s;
          this.selectedCategory = null;
          this.searchQuery = '';
          this.bankFilterCats = [];
          this.bankQuery = '';
          this.starred = {};
          this.ctxOpen = {};
          this.computeBankStats();
          this.resetConversation();
          this.$nextTick(() => {
            renderGraph(this);
            setTimeout(() => { this.sectorSwitching = false; queueIcons(); }, 300);
          });
        }, 200);
      },

      // ---------- chat ----------
      resetConversation() {
        this.conversation = [];
        this.data.chatExamples.forEach(ex => this.pushExchange(ex, /*instant=*/true));
        this.$nextTick(() => { queueIcons(); this.scrollChatToBottom(); });
      },
      runPrompt(text, ev) {
        if (ev?.currentTarget) {
          ev.currentTarget.classList.add('chip-pulse');
          setTimeout(() => ev.currentTarget.classList.remove('chip-pulse'), 700);
        }
        // Try to match scripted response by exact userText first
        const all = { ...this.data.scriptedResponses };
        let match = null;
        for (const key in all) {
          if (all[key].userText.toLowerCase() === text.toLowerCase()) { match = all[key]; break; }
        }
        if (!match) {
          // Match against the two main examples
          const ex = this.data.chatExamples.find(e => e.userText.toLowerCase() === text.toLowerCase());
          if (ex) {
            this.pushExchange(ex, false);
            return;
          }
          // Fallback shouldn't happen since prompts come from data
          match = Object.values(all)[0];
        }
        this.pushExchange({
          userText: match.userText,
          userTime: nowStamp(),
          intro: match.intro,
          bullets: match.bullets,
          outro: match.outro,
          time: nowStamp(),
          references: match.references,
        }, false);
      },
      pushExchange(ex, instant) {
        const uid = this._nextMsgId++;
        const aid = this._nextMsgId++;
        this.conversation.push({ id: uid, role: 'user', text: ex.userText, time: ex.userTime || nowStamp() });

        if (instant) {
          this.conversation.push({
            id: aid, role: 'assistant',
            intro: ex.intro, introVisible: ex.intro,
            bullets: ex.bullets, visibleBullets: ex.bullets.slice(),
            outro: ex.outro, outroVisible: ex.outro,
            time: ex.time, references: ex.references, popoverOpen: false,
            streaming: false, bulletsRevealed: true,
          });
          this.$nextTick(() => { queueIcons(); this.scrollChatToBottom(); });
          return;
        }

        // Streamed version — push a placeholder then mutate via array index,
        // so Alpine's reactive proxy sees every change (a held reference would
        // bypass the proxy on some Alpine versions).
        this.conversation.push({
          id: aid, role: 'assistant',
          intro: ex.intro, introVisible: ex.intro,
          bullets: ex.bullets, visibleBullets: [],
          outro: ex.outro, outroVisible: '',
          time: ex.time || nowStamp(), references: null, popoverOpen: false,
          streaming: true, bulletsRevealed: false,
        });
        const mi = this.conversation.length - 1;
        const self = this;
        this.$nextTick(() => self.scrollChatToBottom());

        const bulletDelay = 220;
        ex.bullets.forEach((b, i) => {
          setTimeout(() => {
            if (!self.conversation[mi]) return;
            self.conversation[mi].visibleBullets = self.conversation[mi].visibleBullets.concat([b]);
            self.scrollChatToBottom();
          }, 200 + i * bulletDelay);
        });
        setTimeout(() => {
          if (!self.conversation[mi]) return;
          self.conversation[mi].outroVisible = ex.outro;
          self.conversation[mi].bulletsRevealed = true;
          self.conversation[mi].streaming = false;
        }, 200 + ex.bullets.length * bulletDelay + 100);
        setTimeout(() => {
          if (!self.conversation[mi]) return;
          self.conversation[mi].references = ex.references;
          self.$nextTick(() => { queueIcons(); self.scrollChatToBottom(); });
        }, 200 + ex.bullets.length * bulletDelay + 350);
      },
      scrollChatToBottom() {
        const el = document.getElementById('chat-scroll');
        if (el) el.scrollTop = el.scrollHeight + 999;
      },

      // ---------- init ----------
      init() {
        this.computeBankStats();
        this.resetConversation();
        // Defer graph render until the browser has laid out the canvas — at
        // x-init time the x-cloak attribute is still applied, so clientWidth
        // would be 0 and all forceX/Y anchors would collapse to the origin.
        const renderWhenSized = () => {
          const svg = document.getElementById('graph-svg');
          if (svg && svg.clientWidth > 0) renderGraph(this);
          else requestAnimationFrame(renderWhenSized);
        };
        requestAnimationFrame(renderWhenSized);
        this.$nextTick(queueIcons);
        // React to relevant state for D3
        this.$watch('selectedNode', () => updateGraphSelection(this));
        this.$watch('selectedCategory', () => updateGraphCategoryFilter(this));
        this.$watch('searchQuery', () => updateGraphSearch(this));
        // Re-render icons when major view state changes
        this.$watch('view',  () => queueIcons());
        this.$watch('sector',() => queueIcons());
        this.$watch('bankFilterCats', () => queueIcons());
        this.$watch('bankSort', () => queueIcons());
        this.$watch('bankQuery', () => queueIcons());
        this.$watch('modalNode', () => queueIcons());
        // Resize handling
        window.addEventListener('resize', () => { if (this.view === 'graph') renderGraph(this); });
      },
    };
  }

  // =========================================================================
  //  Helpers
  // =========================================================================
  function nowStamp() {
    const d = new Date();
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ampm}`;
  }
  function ageRank(s) {
    // crude rank so "Most Recent" sort works on the hand-authored ageStr field
    const m = s.match(/(\d+)\s*([hdmw])/);
    if (!m) return 0;
    const n = parseInt(m[1], 10);
    const mult = { h: 1, d: 24, w: 168, m: 720 }[m[2]] || 1;
    return n * mult;
  }
  let _iconTimer = null;
  function queueIcons() {
    if (_iconTimer) return;
    _iconTimer = setTimeout(() => {
      _iconTimer = null;
      if (window.lucide && lucide.createIcons) lucide.createIcons();
    }, 40);
  }

  // =========================================================================
  //  D3 GRAPH
  //
  //  Force-directed graph rendered into #graph-svg. We let the simulation
  //  settle for ~1500ms then stop it — continuous physics is mesmerising for
  //  three seconds and exhausting after ten. Dragging a node re-energises
  //  the simulation briefly so the rest of the graph rebalances, then we
  //  let it cool again.
  // =========================================================================
  let _g = {
    svg: null, root: null, linkLayer: null, nodeLayer: null, labelLayer: null,
    sim: null, nodes: [], edges: [], app: null, zoom: null, tooltip: null,
  };

  function renderGraph(app) {
    const svg = d3.select('#graph-svg');
    if (svg.empty()) return;
    _g.app = app;
    _g.tooltip = document.getElementById('graph-tooltip');

    const data = app.data;
    const width  = Math.max(svg.node().clientWidth,  800);
    const height = Math.max(svg.node().clientHeight, 600);
    svg.attr('viewBox', [0, 0, width, height]);

    // Clear + rebuild
    svg.selectAll('*').remove();
    const root = svg.append('g').attr('class','graph-root');
    _g.svg = svg; _g.root = root;
    _g.linkLayer  = root.append('g').attr('class','links');
    _g.labelLayer = root.append('g').attr('class','clusters');
    _g.nodeLayer  = root.append('g').attr('class','nodes');

    // Zoom / pan
    _g.zoom = d3.zoom().scaleExtent([0.4, 2.5])
      .on('zoom', e => root.attr('transform', e.transform));
    svg.call(_g.zoom);

    // Anchor each category on a ring around the canvas center. Seed each
    // node's starting position at (or jittered around) its category anchor so
    // the simulation converges quickly to a cleanly-clustered layout.
    const _anchorR = Math.min(svg.node().clientWidth, svg.node().clientHeight) * 0.30;
    const _cats = data.categories.map(c => c.id);
    const _catAnchors = {};
    _cats.forEach((cid, i) => {
      const a = (i / _cats.length) * Math.PI * 2 - Math.PI / 2;
      _catAnchors[cid] = {
        x: (svg.node().clientWidth  || 1200) / 2 + Math.cos(a) * _anchorR,
        y: (svg.node().clientHeight || 800)  / 2 + Math.sin(a) * _anchorR,
      };
    });
    const nodes = data.nodes.map(n => {
      const a = _catAnchors[n.category];
      return { ...n, x: a.x + (Math.random() - 0.5) * 40, y: a.y + (Math.random() - 0.5) * 40 };
    });
    const idx = new Map(nodes.map(n => [n.id, n]));
    const edges = data.edges
      .map(([a,b,s]) => ({ source: idx.get(a), target: idx.get(b), strength: s||1 }))
      .filter(l => l.source && l.target);
    _g.nodes = nodes; _g.edges = edges;

    // Importance 70–100 → radius 10–26 (diameter 20–52). PRD section 3.2.
    const r = importance => 10 + Math.max(0, (importance - 70)) * (16 / 30);
    const linkColor = src => app.catColor(src.category);

    // Build edges (curved)
    const link = _g.linkLayer.selectAll('path').data(edges).join('path')
      .attr('class','edge')
      .attr('stroke', d => linkColor(d.source))
      .attr('stroke-width', 1.2)
      .attr('stroke-opacity', 0.30);

    // Build nodes
    const node = _g.nodeLayer.selectAll('g.node').data(nodes, d => d.id).join('g')
      .attr('class','node')
      .style('cursor','pointer');

    node.append('circle')
      .attr('class','node-circle')
      .attr('r', d => r(d.importance))
      .attr('fill', d => app.catColor(d.category))
      .attr('stroke', '#fff').attr('stroke-width', 2)
      .attr('filter','drop-shadow(0 1px 2px rgba(15,23,42,.15))');

    node.append('text')
      .attr('class','node-label')
      .style('opacity', d => d.importance >= 88 ? 1 : 0)
      .text(d => d.importance);

    // Hover behavior
    node
      .on('mouseenter', (event, d) => {
        if (_g.app.selectedNode) return; // don't fight panel mode
        highlightNeighborhood(d.id, true);
        showTooltip(event, d);
      })
      .on('mousemove', (event) => moveTooltip(event))
      .on('mouseleave', () => {
        if (_g.app.selectedNode) return;
        clearHighlight();
        hideTooltip();
      })
      .on('click', (event, d) => {
        event.stopPropagation();
        _g.app.selectNode(d.id);
        hideTooltip();
      });

    // Drag
    node.call(d3.drag()
      .on('start', (event, d) => { if (!event.active) _g.sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end',   (event, d) => {
        if (!event.active) _g.sim.alphaTarget(0);
        d.fx = null; d.fy = null;
        // Let it settle then stop
        setTimeout(() => _g.sim.stop(), 600);
      }));

    // Simulation
    if (_g.sim) _g.sim.stop();
    _g.sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(edges).id(d => d.id).distance(d => 70 + (1 - (d.strength || 1)) * 30).strength(0.45))
      .force('charge', d3.forceManyBody().strength(-320))
      .force('x', d3.forceX(d => _catAnchors[d.category].x).strength(0.22))
      .force('y', d3.forceY(d => _catAnchors[d.category].y).strength(0.22))
      .force('collide', d3.forceCollide(d => r(d.importance) + 8))
      .on('tick', () => {
        link.attr('d', d => {
          const dx = d.target.x - d.source.x;
          const dy = d.target.y - d.source.y;
          const dr = Math.sqrt(dx*dx + dy*dy) * 4;
          return `M${d.source.x},${d.source.y} A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
        });
        node.attr('transform', d => `translate(${d.x},${d.y})`);
      });

    // Stop after settle window
    setTimeout(() => {
      if (_g.sim) _g.sim.stop();
      renderClusterLabels();
    }, 1500);

    // Reset zoom transform whenever we render
    svg.transition().duration(0).call(_g.zoom.transform, d3.zoomIdentity);
  }

  function renderClusterLabels() {
    // Pill labels placed above each category cluster's centroid. Computed after
    // simulation settles so positions are stable.
    const groups = {};
    _g.nodes.forEach(n => {
      const r = 10 + Math.max(0, (n.importance - 70)) * (16 / 30);
      if (!groups[n.category]) groups[n.category] = { x: 0, y: 0, n: 0, topY: Infinity, topR: 0 };
      groups[n.category].x += n.x;
      groups[n.category].y += n.y;
      groups[n.category].n += 1;
      if (n.y - r < groups[n.category].topY) {
        groups[n.category].topY = n.y - r;
        groups[n.category].topR = r;
      }
    });
    const labels = Object.entries(groups).map(([cat, g]) => ({
      cat,
      x: g.x / g.n,
      y: g.topY - 14,
      name: _g.app.catName(cat),
    }));

    _g.labelLayer.selectAll('*').remove();
    const sel = _g.labelLayer.selectAll('g.cluster').data(labels, d => d.cat)
      .join('g').attr('class','cluster').style('opacity', 0);

    sel.attr('transform', d => `translate(${d.x},${d.y})`);
    sel.append('rect').attr('class','cluster-label-bg').attr('rx', 9).attr('ry', 9);
    sel.append('text').attr('class','cluster-label').attr('text-anchor','middle')
      .attr('dy', '0.34em').text(d => d.name);
    // Size the pill to the text
    sel.each(function() {
      const g = d3.select(this);
      const t = g.select('text').node();
      const bb = t.getBBox();
      g.select('rect')
        .attr('x', bb.x - 8).attr('y', bb.y - 4)
        .attr('width', bb.width + 16).attr('height', bb.height + 8);
    });
    sel.transition().duration(400).style('opacity', 1);
  }

  function highlightNeighborhood(id, viaHover) {
    const neighborSet = new Set([id]);
    _g.edges.forEach(e => {
      if (e.source.id === id) neighborSet.add(e.target.id);
      else if (e.target.id === id) neighborSet.add(e.source.id);
    });
    _g.nodeLayer.selectAll('g.node')
      .style('opacity', d => neighborSet.has(d.id) ? 1 : 0.18)
      .select('circle')
      .attr('stroke-width', d => d.id === id ? 3 : 2)
      .attr('r', d => {
        const base = 10 + Math.max(0, (d.importance - 70)) * (16 / 30);
        return d.id === id ? base * 1.15 : base;
      })
      .attr('stroke', d => d.id === id ? _g.app.catColor(d.category) : '#fff');
    _g.linkLayer.selectAll('path')
      .attr('stroke-opacity', e => (e.source.id === id || e.target.id === id) ? 0.8 : 0.06)
      .attr('stroke-width',   e => (e.source.id === id || e.target.id === id) ? 1.8 : 1);
    _g.labelLayer.selectAll('g.cluster').style('opacity', 0.35);
  }

  function clearHighlight() {
    _g.nodeLayer.selectAll('g.node')
      .style('opacity', 1)
      .select('circle')
      .attr('stroke-width', 2)
      .attr('stroke', '#fff')
      .attr('r', d => 10 + Math.max(0, (d.importance - 70)) * (16 / 30));
    _g.linkLayer.selectAll('path')
      .attr('stroke-opacity', 0.30)
      .attr('stroke-width', 1.2);
    _g.labelLayer.selectAll('g.cluster').style('opacity', 1);
  }

  function updateGraphSelection(app) {
    if (!_g.svg) return;
    if (app.selectedNode) highlightNeighborhood(app.selectedNode.id, false);
    else clearHighlight();
  }

  function focusGraphNode(id) {
    if (!_g.svg) return;
    highlightNeighborhood(id, false);
  }
  function clearGraphFocus() {
    if (!_g.svg) return;
    clearHighlight();
  }

  function centerGraphOnNode(id) {
    if (!_g.svg) return;
    const n = _g.nodes.find(x => x.id === id);
    if (!n) return;
    const width  = _g.svg.node().clientWidth;
    const height = _g.svg.node().clientHeight;
    const t = d3.zoomIdentity.translate(width/2 - n.x*1.2, height/2 - n.y*1.2).scale(1.2);
    _g.svg.transition().duration(550).call(_g.zoom.transform, t);
  }

  function updateGraphCategoryFilter(app) {
    if (!_g.svg) return;
    const cat = app.selectedCategory;
    if (!cat) { clearHighlight(); return; }
    _g.nodeLayer.selectAll('g.node')
      .style('opacity', d => d.category === cat ? 1 : 0.15);
    _g.linkLayer.selectAll('path')
      .attr('stroke-opacity', e => (e.source.category === cat || e.target.category === cat) ? 0.5 : 0.05);
  }

  function updateGraphSearch(app) {
    if (!_g.svg) return;
    const q = (app.searchQuery || '').toLowerCase().trim();
    if (!q) { clearHighlight(); return; }
    _g.nodeLayer.selectAll('g.node')
      .style('opacity', d => {
        const hay = (d.name + ' ' + d.description + ' ' + (d.tags||[]).join(' ')).toLowerCase();
        return hay.includes(q) ? 1 : 0.12;
      });
    _g.linkLayer.selectAll('path').attr('stroke-opacity', 0.08);
  }

  function showTooltip(event, d) {
    const t = _g.tooltip; if (!t) return;
    t.innerHTML = `${escapeHTML(d.name)}<span class="imp">${d.importance}</span>`;
    t.style.left = event.clientX + 'px';
    t.style.top  = event.clientY + 'px';
    t.classList.add('show');
  }
  function moveTooltip(event) {
    const t = _g.tooltip; if (!t) return;
    t.style.left = event.clientX + 'px';
    t.style.top  = event.clientY + 'px';
  }
  function hideTooltip() { const t = _g.tooltip; if (t) t.classList.remove('show'); }
  function escapeHTML(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // Bootstrap icons after Alpine initial render
  document.addEventListener('alpine:initialized', () => queueIcons());
  document.addEventListener('DOMContentLoaded', () => queueIcons());
  </script>
</body>
</html>
